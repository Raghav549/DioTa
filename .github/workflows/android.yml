name: Android app

# Builds the DioTa Android app (a wrapper around the website, see android/).
# Download it from this workflow run's "Artifacts" section, or from the "android-latest" release.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website the app opens (leave empty for the default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ inputs.site_url || vars.DIOTA_URL || 'https://dio-ta.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Without a release key, keep the same debug key between builds so new APKs install over old ones.
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with the cached debug key. See android/README.md to add a permanent key."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PdiotaUrl="$SITE_URL" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="1.0.${{ github.run_number }}"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/DioTa.apk"
          ls -l "$RUNNER_TEMP/out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DioTa-android-apk
          path: ${{ runner.temp }}/out/DioTa.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="DioTa Android app, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}). Opens $SITE_URL. Install: download DioTa.apk on your phone, open it and allow installing from this source."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "DioTa Android (latest)" --notes "$NOTES"
          else
            gh release create android-latest --title "DioTa Android (latest)" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          gh release upload android-latest "$RUNNER_TEMP/out/DioTa.apk" --clobber
